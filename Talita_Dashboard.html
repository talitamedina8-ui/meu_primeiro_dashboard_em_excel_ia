<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Talita</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #172033;
}
.dashboard {
  max-width: 1100px;
  margin: 30px auto;
  padding: 24px;
}
.header {
  background: #2563eb;
  color: white;
  border-radius: 18px;
  padding: 26px;
  margin-bottom: 20px;
}
.header h1 { margin: 0 0 8px; }
.header p { margin: 4px 0; opacity: .95; }
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.card {
  background: white;
  border-radius: 15px;
  padding: 22px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
}
.card span { display:block; color:#64748b; margin-bottom:10px; }
.card strong { font-size:32px; }
.panel {
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}
button {
  background:#2563eb;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}
button:hover { background:#1d4ed8; }
input[type=file] { display:none; }
table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td {
  padding:13px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}
th { background:#eff6ff; }
.status { margin-left:12px; color:#64748b; }
.chart-container { position:relative; height:360px; }
@media(max-width:700px) {
  .cards { grid-template-columns:1fr; }
  .dashboard { margin:10px; padding:10px; }
}
</style>
</head>
<body>
<div class="dashboard">

<div class="header">
  <h1>Dashboard de Estatísticas</h1>
  <p><strong>Aluno:</strong> Talita</p>
  <p><strong>Curso:</strong> Inteligência Artificial</p>
  <p><strong>Data:</strong> 26/09/2016</p>
</div>

<div class="cards">
<div class="card"><span>Precisão</span><strong>85%</strong></div><div class="card"><span>Conclusão</span><strong>92%</strong></div><div class="card"><span>Desempenho</span><strong>88%</strong></div>
</div>

<div class="panel">
  <h2>Importar dados</h2>
  <label for="arquivo">
    <span style="display:inline-block;background:#2563eb;color:white;padding:12px 20px;border-radius:9px;cursor:pointer;font-weight:bold;">
      Importar
    </span>
  </label>
  <input id="arquivo" type="file" accept=".xlsx,.xls,.csv">
  <span id="status" class="status">Nenhum arquivo selecionado.</span>
</div>

<div class="panel">
  <h2>Gráfico</h2>
  <div class="chart-container">
    <canvas id="grafico"></canvas>
  </div>
</div>

<div class="panel">
  <h2>Tabela de estatísticas</h2>
  <table>
    <thead><tr><th>Estatística</th><th>Valor</th></tr></thead>
    <tbody><tr><td>Precisão</td><td>85%</td></tr><tr><td>Conclusão</td><td>92%</td></tr><tr><td>Desempenho</td><td>88%</td></tr></tbody>
  </table>
</div>

</div>

<script>
const dados = [{"nome":'Precisão',"valor":85},{"nome":'Conclusão',"valor":92},{"nome":'Desempenho',"valor":88}];

new Chart(document.getElementById('grafico'), {
  type: 'bar',
  data: {
    labels: dados.map(item => item.nome),
    datasets: [{
      label: 'Valor (%)',
      data: dados.map(item => item.valor)
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      y: { beginAtZero: true, max: 100 }
    }
  }
});

document.getElementById('arquivo').addEventListener('change', function() {
  const file = this.files[0];
  if (file) {
    document.getElementById('status').textContent =
      'Arquivo selecionado: ' + file.name;
  }
});
</script>
</body>
</html>
